name: Build book editions

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Gitea release tag to publish the book files to
        required: false
        type: string

permissions:
  code: read
  releases: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install book builders
        run: |
          apt-get update
          apt-get install --yes curl fonts-dejavu-core jq pandoc python3 python3-pil python3-reportlab zip
      - name: Verify translation structure
        run: python3 tools/verify_translation.py
      - name: Build EPUB, HTML, and PDF editions
        run: python3 tools/build_book.py all
      - name: Create all-formats archive
        run: |
          zip -j dist/Stolz-und-Vorurteil-modernes-Deutsch.zip \
            dist/Stolz-und-Vorurteil-modernes-Deutsch-cover.png \
            dist/Stolz-und-Vorurteil-modernes-Deutsch.epub \
            dist/Stolz-und-Vorurteil-modernes-Deutsch.html \
            dist/Stolz-und-Vorurteil-modernes-Deutsch.pdf
          zip -j dist/Stolz-und-Vorurteil-Einfaches-Deutsch.zip \
            dist/Stolz-und-Vorurteil-Einfaches-Deutsch-cover.png \
            dist/Stolz-und-Vorurteil-Einfaches-Deutsch.epub \
            dist/Stolz-und-Vorurteil-Einfaches-Deutsch.html \
            dist/Stolz-und-Vorurteil-Einfaches-Deutsch.pdf
          zip -j dist/Stolz-und-Vorurteil-Deutsch-Englisch.zip \
            dist/Stolz-und-Vorurteil-Deutsch-Englisch-cover.png \
            dist/Stolz-und-Vorurteil-Deutsch-Englisch.epub \
            dist/Stolz-und-Vorurteil-Deutsch-Englisch.html \
            dist/Stolz-und-Vorurteil-Deutsch-Englisch.pdf
          zip -j dist/Pride-and-Prejudice-Englisch-Deutsch.zip \
            dist/Pride-and-Prejudice-Englisch-Deutsch-cover.png \
            dist/Pride-and-Prejudice-Englisch-Deutsch.epub \
            dist/Pride-and-Prejudice-Englisch-Deutsch.html \
            dist/Pride-and-Prejudice-Englisch-Deutsch.pdf
      # Gitea's artifact service implements the v3 protocol; upstream v4
      # deliberately rejects servers other than GitHub.com.
      - uses: actions/upload-artifact@v3
        with:
          name: book-editions
          path: dist/
      - name: Add book files to Gitea release
        env:
          GITEA_API_URL: ${{ gitea.api_url }}
          GITEA_REPOSITORY: ${{ gitea.repository }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          RELEASE_EVENT_TAG: ${{ gitea.event.release.tag_name }}
          RELEASE_INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            release_tag="$RELEASE_EVENT_TAG"
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ -n "$RELEASE_INPUT_TAG" ]; then
            release_tag="$RELEASE_INPUT_TAG"
          else
            exit 0
          fi

          release_id="$(
            curl --fail-with-body --silent --show-error \
              --header "Authorization: token $GITEA_TOKEN" \
              "$GITEA_API_URL/repos/$GITEA_REPOSITORY/releases/tags/$release_tag" |
              jq --exit-status --raw-output '.id'
          )"

          for file in \
            dist/Stolz-und-Vorurteil-modernes-Deutsch-cover.png \
            dist/Stolz-und-Vorurteil-modernes-Deutsch.epub \
            dist/Stolz-und-Vorurteil-modernes-Deutsch.html \
            dist/Stolz-und-Vorurteil-modernes-Deutsch.pdf \
            dist/Stolz-und-Vorurteil-modernes-Deutsch.zip \
            dist/Stolz-und-Vorurteil-Einfaches-Deutsch-cover.png \
            dist/Stolz-und-Vorurteil-Einfaches-Deutsch.epub \
            dist/Stolz-und-Vorurteil-Einfaches-Deutsch.html \
            dist/Stolz-und-Vorurteil-Einfaches-Deutsch.pdf \
            dist/Stolz-und-Vorurteil-Einfaches-Deutsch.zip \
            dist/Stolz-und-Vorurteil-Deutsch-Englisch-cover.png \
            dist/Stolz-und-Vorurteil-Deutsch-Englisch.epub \
            dist/Stolz-und-Vorurteil-Deutsch-Englisch.html \
            dist/Stolz-und-Vorurteil-Deutsch-Englisch.pdf \
            dist/Stolz-und-Vorurteil-Deutsch-Englisch.zip \
            dist/Pride-and-Prejudice-Englisch-Deutsch-cover.png \
            dist/Pride-and-Prejudice-Englisch-Deutsch.epub \
            dist/Pride-and-Prejudice-Englisch-Deutsch.html \
            dist/Pride-and-Prejudice-Englisch-Deutsch.pdf \
            dist/Pride-and-Prejudice-Englisch-Deutsch.zip
          do
            filename="$(basename "$file")"
            existing_id="$(
              curl --fail-with-body --silent --show-error \
                --header "Authorization: token $GITEA_TOKEN" \
                "$GITEA_API_URL/repos/$GITEA_REPOSITORY/releases/$release_id/assets" |
                jq --raw-output --arg name "$filename" \
                  '.[] | select(.name == $name) | .id' |
                head -n 1
            )"
            if [ -n "$existing_id" ]; then
              curl --fail-with-body --silent --show-error \
                --request DELETE \
                --header "Authorization: token $GITEA_TOKEN" \
                "$GITEA_API_URL/repos/$GITEA_REPOSITORY/releases/$release_id/assets/$existing_id"
            fi
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: token $GITEA_TOKEN" \
              --form "attachment=@$file" \
              "$GITEA_API_URL/repos/$GITEA_REPOSITORY/releases/$release_id/assets?name=$filename"
          done
